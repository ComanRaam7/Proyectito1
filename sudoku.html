
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Sudoku | Grayscale</title>

    <style>
        /*CONFIGURACIÓN GENERAL*/

        :root {
            --gris-fondo: #000000;
            --gris-panel: #161616;
            --gris-claro: #d9d9d9;
            --gris-oscuro: #555555;
            --gris-borde: #303030;
            --gris-texto: #ffffff;
            --gris-secundario: #aaaaaa;
            --primario: #64a19d;
            --primario-hover: #50817e;

            font-family: "Nunito", "Helvetica Neue", Arial, sans-serif;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            background: var(--gris-fondo);
        }

        body {
            min-height: 100vh;
            color: var(--gris-texto);
            font-family: "Nunito", "Helvetica Neue", Arial, sans-serif;
        }

        /*CONTENEDOR PRINCIPAL*/

        #sudoku-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 45px 15px;
            background: var(--gris-fondo);
            color: var(--gris-texto);
        }

        .sudoku-header {
            width: min(100%, 520px);
            margin: 0 auto 25px;
            text-align: center;
        }

        .sudoku-header h1 {
            margin: 0 0 10px;
            color: var(--gris-texto);
            font-family: "Montserrat", "Varela Round", sans-serif;
            font-size: clamp(2rem, 5vw, 2.6rem);
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .sudoku-header p {
            margin: 0;
            color: var(--gris-secundario);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /*TABLERO DE SUDOKU*/

        #sudoku-app .sudoku-container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: min(100%, 470px);
            margin: 0 auto;
            padding: 10px;
            overflow: hidden;
            border: 1px solid var(--gris-borde);
            border-radius: 5px;
            background: var(--gris-panel);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }

        /* Filas independientes de Bootstrap */

        #sudoku-app .sudoku-row {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /*CELDAS*/

        #sudoku-app .cell {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 0;
            aspect-ratio: 1 / 1;
            margin: 0;
            padding: 0;
            border: 1px solid #777777;
            border-radius: 0;
            outline: none;
            background-clip: padding-box;
            font-family: "Nunito", "Helvetica Neue", Arial, sans-serif;
            font-size: clamp(13px, 3.5vw, 19px);
            font-weight: 600;
            line-height: 1;
            text-align: center;
            appearance: none;
            -webkit-appearance: none;
        }

        /*SEPARACIÓN DE BLOQUES 3X3*/

        /* Líneas verticales */

        #sudoku-app .cell:nth-child(3n) {
            border-right: 3px solid #222222;
        }

        #sudoku-app .cell:last-child {
            border-right: 0;
        }

        /* Líneas horizontales */

        #sudoku-app .sudoku-row:nth-child(3n) .cell {
            border-bottom: 3px solid #222222;
        }

        #sudoku-app .sudoku-row:last-child .cell {
            border-bottom: 0;
        }

        /*COLORES DE LOS BLOQUES 3X3*/

        #sudoku-app .lightBackground {
            background-color: #d9d9d9;
        }

        #sudoku-app .darkBackground {
            background-color: #555555;
        }

        /*CELDAS FIJAS*/

        #sudoku-app .fixed {
            color: #161616;
            font-weight: 800;
            cursor: default;
        }

        #sudoku-app .fixed.darkBackground {
            color: #ffffff;
        }

        /*CELDAS EDITABLES*/

        #sudoku-app .user-input {
            color: #176d68;
            font-weight: 800;
            cursor: text;
        }

        #sudoku-app .user-input.darkBackground {
            color: #a6ded9;
        }

        /* Selección de celda */

        #sudoku-app .cell:focus {
            position: relative;
            z-index: 2;
            background-color: #d5efec !important;
            color: #176d68 !important;
            outline: 2px solid var(--primario);
            outline-offset: -2px;
        }

        /*BOTONES*/

        #sudoku-app .buttonContainer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: min(100%, 470px);
            margin: 22px auto 0;
        }

        #sudoku-app .buttonContainer button {
            flex: 1 1 110px;
            min-height: 44px;
            padding: 12px 16px;
            border: 1px solid var(--primario);
            border-radius: 4px;
            background: var(--primario);
            color: #ffffff;
            font-family: "Nunito", "Helvetica Neue", Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        #sudoku-app .buttonContainer button:hover {
            border-color: var(--primario-hover);
            background: var(--primario-hover);
            transform: translateY(-2px);
        }

        #sudoku-app .buttonContainer button:active {
            transform: translateY(0);
        }

        #sudoku-app .buttonContainer button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 3px;
        }

        /* ========================================
           MENSAJES DE RESULTADO
        ======================================== */

        #sudoku-app .sudoku-result {
            width: min(100%, 470px);
            min-height: 46px;
            margin: 20px auto 0;
            padding: 12px;
            border-left: 3px solid var(--primario);
            border-radius: 2px;
            background: var(--gris-panel);
            color: var(--gris-texto);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
        }

        #sudoku-app .sudoku-result.correct {
            border-left-color: var(--primario);
            color: #80c5bf;
        }

        #sudoku-app .sudoku-result.incorrect {
            border-left-color: #d66b6b;
            color: #e58a8a;
        }

        /* ========================================
           RESPONSIVE - TABLETS
        ======================================== */

        @media (max-width: 768px) {
            #sudoku-app {
                padding: 30px 12px;
            }

            #sudoku-app .sudoku-container {
                width: min(100%, 440px);
            }
        }

        /* ========================================
           RESPONSIVE - MÓVILES
        ======================================== */

        @media (max-width: 480px) {
            #sudoku-app {
                padding: 22px 8px;
            }

            .sudoku-header {
                margin-bottom: 18px;
            }

            #sudoku-app .sudoku-container {
                width: 100%;
                padding: 7px;
            }

            #sudoku-app .cell {
                font-size: clamp(12px, 4vw, 16px);
            }

            #sudoku-app .buttonContainer {
                gap: 8px;
            }

            #sudoku-app .buttonContainer button {
                flex: 1 1 100px;
                padding: 11px 8px;
                font-size: 0.75rem;
            }

            #sudoku-app .sudoku-result {
                padding: 10px;
                font-size: 0.85rem;
            }
        }

/* ========================================
   BARRA SUPERIOR (ESTILO GRAYSCALE)
======================================== */

.top-navbar {
    width: 100%;
    padding: 18px 36px;
    background: rgba(12, 12, 12, 0.92);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
}

.brand-link {
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.5px;
    transition: color 0.2s ease;
}

.brand-link:hover {
    color: #ffffff;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
}

.nav-links a {
    color: rgba(255, 255, 255, 0.65);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: color 0.2s ease;
}

.nav-links a:hover,
.nav-links a.active-link {
    color: #ffffff;
}


        
    </style>
</head>

<body>


    <!-- Barra superior estilo Grayscale -->
    <nav class="top-navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand-link">Proyectito</a>
            <div class="nav-links">
                <a href="index.html#about">Nosotros</a>
                <a href="index.html#projects">Proyecto</a>
                <a href="index.html#contact">Contacto</a>
                <a href="categorias.html" class="active-link">Categorías</a>
            </div>
        </div>
    </nav>

    <main id="sudoku-app">

        <header class="sudoku-header">
            <h1>Sudoku</h1>
            <p>
                Completa las casillas con números del 1 al 9
                sin repetirlos en filas, columnas ni bloques.
            </p>
        </header>

        <div
            class="sudoku-container"
            id="container"
            aria-label="Tablero de Sudoku">
        </div>

        <div class="buttonContainer">
            <button type="button" id="checkButton">Comprobar</button>
            <button type="button" id="solveButton">Resolver</button>
            <button type="button" id="resetButton">Nuevo juego</button>
        </div>

        <div
            class="sudoku-result"
            id="result"
            role="status"
            aria-live="polite">
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const container = document.getElementById("container");
            const resultElement = document.getElementById("result");
            const checkButton = document.getElementById("checkButton");
            const solveButton = document.getElementById("solveButton");
            const resetButton = document.getElementById("resetButton");

            let initialPuzzle = [];

            // MEZCLAR NÚMEROS ALEATORIAMENTE

            function shuffle(array) {

                for (let i = array.length - 1; i > 0; i--) {

                    const j = Math.floor(Math.random() * (i + 1));

                    [array[i], array[j]] = [array[j], array[i]];
                }

                return array;
            }

            // GENERAR SUDOKU

            function generateRandomSudoku(emptyCellsCount = 40) {

                const board = Array.from(
                    { length: 9 },
                    () => Array(9).fill(0)
                );

                // Llenar las tres cajas diagonales.

                for (let box = 0; box < 9; box += 3) {
                    fillBox(board, box, box);
                }

                // Completar el resto del tablero.

                solveHelper(board);

                // Eliminar posiciones distintas para crear el reto.

                const positions = shuffle(
                    Array.from({ length: 81 }, (_, index) => [
                        Math.floor(index / 9),
                        index % 9
                    ])
                );

                const cellsToRemove = Math.min(
                    Math.max(emptyCellsCount, 0),
                    81
                );

                for (let i = 0; i < cellsToRemove; i++) {

                    const [row, col] = positions[i];

                    board[row][col] = 0;
                }

                return board;
            }

            // LLENAR BLOQUES 3X3

            function fillBox(board, rowStart, colStart) {

                const numbers = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);

                let index = 0;

                for (let row = 0; row < 3; row++) {

                    for (let col = 0; col < 3; col++) {

                        board[rowStart + row][colStart + col] = numbers[index++];
                    }
                }
            }

            // RESOLVER SUDOKU

            function solveSudoku(board) {

                const copy = board.map(row => [...row]);

                return solveHelper(copy) ? copy : null;
            }

            function solveHelper(board) {

                const emptyCell = findEmptyCell(board);

                if (!emptyCell) return true;

                const [row, col] = emptyCell;

                for (let number = 1; number <= 9; number++) {

                    if (isValidMove(board, row, col, number)) {

                        board[row][col] = number;

                        if (solveHelper(board)) return true;

                        board[row][col] = 0;
                    }
                }

                return false;
            }

            // ENCONTRAR CELDA VACÍA

            function findEmptyCell(board) {

                for (let row = 0; row < 9; row++) {

                    for (let col = 0; col < 9; col++) {

                        if (board[row][col] === 0) {
                            return [row, col];
                        }
                    }
                }

                return null;
            }

            // VALIDAR MOVIMIENTO

            function isValidMove(board, row, col, number) {

                // Revisar filas y columnas.

                for (let index = 0; index < 9; index++) {

                    if (
                        board[row][index] === number ||
                        board[index][col] === number
                    ) {
                        return false;
                    }
                }

                // Identificar el bloque 3x3.

                const startRow = Math.floor(row / 3) * 3;
                const startCol = Math.floor(col / 3) * 3;

                // Revisar el bloque.

                for (
                    let currentRow = startRow;
                    currentRow < startRow + 3;
                    currentRow++
                ) {

                    for (
                        let currentCol = startCol;
                        currentCol < startCol + 3;
                        currentCol++
                    ) {

                        if (board[currentRow][currentCol] === number) {
                            return false;
                        }
                    }
                }

                return true;
            }

            // LEER TABLERO ACTUAL

            function getCurrentBoardFromDOM() {

                const board = [];

                const rows = container.querySelectorAll(".sudoku-row");

                rows.forEach(rowElement => {

                    const rowValues = [];

                    rowElement.querySelectorAll(".cell").forEach(cell => {

                        const value = Number.parseInt(cell.value, 10);

                        rowValues.push(Number.isNaN(value) ? 0 : value);
                    });

                    board.push(rowValues);
                });

                return board;
            }

            // CREAR TABLERO EN HTML

            function createSudokuGrid(board, basePuzzle) {

                container.innerHTML = "";

                resultElement.textContent = "";
                resultElement.className = "sudoku-result";

                board.forEach((row, rowIndex) => {

                    const rowElement = document.createElement("div");

                    rowElement.classList.add("sudoku-row");
                    rowElement.setAttribute("role", "group");
                    rowElement.setAttribute("aria-label", `Fila ${rowIndex + 1}`);

                    row.forEach((cell, columnIndex) => {

                        const cellElement = document.createElement("input");

                        cellElement.classList.add("cell");

                        cellElement.type = "text";
                        cellElement.inputMode = "numeric";
                        cellElement.autocomplete = "off";
                        cellElement.maxLength = 1;

                        cellElement.value = cell !== 0 ? String(cell) : "";

                        cellElement.setAttribute(
                            "aria-label",
                            `Fila ${rowIndex + 1}, columna ${columnIndex + 1}`
                        );

                        // Alternar colores por bloque 3x3.

                        const boxIndex =
                            Math.floor(rowIndex / 3) +
                            Math.floor(columnIndex / 3);

                        cellElement.classList.add(
                            boxIndex % 2 === 0
                                ? "lightBackground"
                                : "darkBackground"
                        );

                        // Bloquear celdas originales.

                        if (basePuzzle[rowIndex][columnIndex] !== 0) {

                            cellElement.readOnly = true;

                            cellElement.classList.add("fixed");

                            cellElement.setAttribute("aria-readonly", "true");

                        } else {

                            cellElement.classList.add("user-input");

                            cellElement.setAttribute(
                                "aria-label",
                                `Casilla editable, fila ${rowIndex + 1}, columna ${columnIndex + 1}`
                            );

                            // Permitir únicamente números del 1 al 9.

                            cellElement.addEventListener("input", function () {

                                this.value = this.value
                                    .replace(/[^1-9]/g, "")
                                    .slice(0, 1);

                                resultElement.textContent = "";
                                resultElement.className = "sudoku-result";
                            });
                        }

                        rowElement.appendChild(cellElement);
                    });

                    container.appendChild(rowElement);
                });
            }

            // COMPROBAR SOLUCIÓN

            function checkSolution() {

                const currentBoard = getCurrentBoardFromDOM();

                // Comprobar estructura del tablero.

                if (
                    currentBoard.length !== 9 ||
                    currentBoard.some(row => row.length !== 9)
                ) {

                    resultElement.textContent =
                        "No se pudo leer correctamente el tablero. Reinicia el juego.";

                    resultElement.className = "sudoku-result incorrect";

                    return;
                }

                // Revisar todas las celdas.

                for (let row = 0; row < 9; row++) {

                    for (let col = 0; col < 9; col++) {

                        const number = currentBoard[row][col];

                        // Comprobar casillas vacías.

                        if (number === 0) {

                            resultElement.textContent =
                                "El tablero aún tiene casillas vacías.";

                            resultElement.className =
                                "sudoku-result incorrect";

                            return;
                        }

                        // Vaciar temporalmente la celda para validarla.

                        currentBoard[row][col] = 0;

                        const valid = isValidMove(
                            currentBoard,
                            row,
                            col,
                            number
                        );

                        currentBoard[row][col] = number;

                        // Detectar números repetidos.

                        if (!valid) {

                            resultElement.textContent =
                                "Hay números repetidos. ¡Sigue intentando!";

                            resultElement.className =
                                "sudoku-result incorrect";

                            return;
                        }
                    }
                }

                // Tablero completo y válido.

                resultElement.textContent =
                    "¡Felicidades! Has completado correctamente el Sudoku.";

                resultElement.className = "sudoku-result correct";
            }

            // RESOLVER TABLERO AUTOMÁTICAMENTE

            function solvePuzzle() {

                const solved = solveSudoku(initialPuzzle);

                if (solved) {

                    createSudokuGrid(solved, initialPuzzle);

                    resultElement.textContent =
                        "Sudoku resuelto automáticamente.";

                    resultElement.className = "sudoku-result correct";

                } else {

                    resultElement.textContent =
                        "No se encontró una solución para este tablero.";

                    resultElement.className = "sudoku-result incorrect";
                }
            }

            // GENERAR NUEVO JUEGO

            function resetPuzzle() {

                initialPuzzle = generateRandomSudoku(40);

                createSudokuGrid(initialPuzzle, initialPuzzle);
            }

            // INICIALIZACIÓN Y EVENTOS

            resetPuzzle();

            checkButton.addEventListener("click", checkSolution);

            solveButton.addEventListener("click", solvePuzzle);

            resetButton.addEventListener("click", resetPuzzle);

        });
    </script>

</body>
</html>
