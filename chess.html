<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#242424">
    <title>Ajedrez</title>
    <link rel="stylesheet" href="css/Ajedrez.css">
</head>
<body>
    <main class="contenedor-juego">
        <header class="encabezado">
            <h1>Ajedrez</h1>
            <p>Selecciona una pieza y después la casilla de destino.</p>
        </header>

        <div class="contenido-juego">
            <section class="zona-tablero" aria-label="Zona del tablero">
                <div id="tablero" class="tablero" role="grid" aria-label="Tablero de ajedrez"></div>
            </section>

            <aside class="panel-lateral">
                <section id="turnos" class="panel turnos" aria-live="polite">
                    <h2>Turno</h2>
                    <p id="mensaje-turno">Turno de las piezas blancas</p>
                    <p id="estado-partida" class="estado-partida">La partida ha comenzado.</p>
                </section>

                <section id="matadas" class="panel capturadas">
                    <h2>Piezas capturadas</h2>
                    <div id="lista-capturas" aria-live="polite"></div>
                </section>

                <button id="reiniciar" class="boton-reiniciar" type="button">Reiniciar partida</button>
            </aside>
        </div>
    </main>

    <!-- Selector de pieza para la coronación de las piezas blancas -->
    <div id="coronadaB" class="selector-coronacion oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-coronacion-blanca">
        <div class="contenido-coronacion">
            <h2 id="titulo-coronacion-blanca">Coronación de las piezas blancas</h2>
            <p>Elige en qué pieza se convertirá el peón:</p>
            <div class="opciones-coronacion">
                <button type="button" data-promocion="q" aria-label="Coronar en reina"><img src="assets/img/Ajedrez/reinaB.png" alt="Reina"></button>
                <button type="button" data-promocion="r" aria-label="Coronar en torre"><img src="assets/img/Ajedrez/torreB.png" alt="Torre"></button>
                <button type="button" data-promocion="b" aria-label="Coronar en alfil"><img src="assets/img/Ajedrez/alfilB.png" alt="Alfil"></button>
                <button type="button" data-promocion="n" aria-label="Coronar en caballo"><img src="assets/img/Ajedrez/caballoB.png" alt="Caballo"></button>
            </div>
        </div>
    </div>

    <!-- Selector de pieza para la coronación de las piezas negras -->
    <div id="coronadaN" class="selector-coronacion oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-coronacion-negra">
        <div class="contenido-coronacion">
            <h2 id="titulo-coronacion-negra">Coronación de las piezas negras</h2>
            <p>Elige en qué pieza se convertirá el peón:</p>
            <div class="opciones-coronacion">
                <button type="button" data-promocion="q" aria-label="Coronar en reina"><img src="assets/img/Ajedrez/reinaN.png" alt="Reina"></button>
                <button type="button" data-promocion="r" aria-label="Coronar en torre"><img src="assets/img/Ajedrez/torreN.png" alt="Torre"></button>
                <button type="button" data-promocion="b" aria-label="Coronar en alfil"><img src="assets/img/Ajedrez/alfilN.png" alt="Alfil"></button>
                <button type="button" data-promocion="n" aria-label="Coronar en caballo"><img src="assets/img/Ajedrez/caballoN.png" alt="Caballo"></button>
            </div>
        </div>
    </div>

    <script type="module" src="js/ajedrez.js"></script>
</body>
</html>
