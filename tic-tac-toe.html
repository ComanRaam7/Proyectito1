
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tres en raya</title>

    <link rel="stylesheet" type="text/css" href="css/tic-tac-toe.css" />
</head>

<body>
    <main class="container">

        <div class="theme-toggle">
            <input type="checkbox" id="theme-switch" />
            <label for="theme-switch">
                Cambiar entre modo oscuro y claro
            </label>
        </div>

        <div id="tictactoe" role="grid" aria-label="Tablero de tres en raya">
        </div>

        <div id="player" align="center">
            <span id="turn" role="status" aria-live="polite">
                Turno del jugador X
            </span>
        </div>

    </main>

    <script type="text/javascript" src="js/tic-tac-toe.js" defer></script>
</body>
</html>
