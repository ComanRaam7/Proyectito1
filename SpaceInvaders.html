<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- ESTILOS DEL JUEGO -->
    <link rel="stylesheet" href="css/stylesInv.css">
    <link rel="shortcut icon" href="assets/img/SpaceInvaders/ovni.png" type="image/x-icon">
    <title>Space Invaders | Proyectito</title>
</head>
<body class="space-page">

    <!-- Barra superior estilo Grayscale -->
    <nav class="top-navbar">
        <div class="nav-inner">
            <a href="index.html" class="brand-link">Proyectito</a>
            <div class="nav-links">
                <a href="index.html#about">Sobre nosotros</a>
                <a href="index.html#projects">Projectos</a>
                <a href="index.html#contact">Contactos</a>
                <a href="categorias.html" class="active-link">Categorías</a>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal del juego -->
    <main class="game-wrapper">
        <div id="hud">
            <a href="arcade.html" id="btn-regresar" class="btn-regresar">
                <i class="bi bi-arrow-left"></i>
                <span>Regresar</span>
            </a>
            <h2 class="hud-stats">
                Puntos: <span id="pontuacao">0</span> <span class="sep">|</span> Oleada: <span id="oleada">1</span>
            </h2>
        </div>

        <div id="grade"></div>

        <!-- Panel de Game Over y Reinicio -->
        <div id="game-over-panel" style="display: none;">
            <h3 id="mensaje-final">¡GAME OVER!</h3>
            <button id="reiniciar" type="button" class="btn-reiniciar">
                <i class="bi bi-arrow-clockwise"></i> Jugar de nuevo
            </button>
        </div>

        <!-- Controles -->
        <div id="controles">
            <button id="esquerda" type="button" aria-label="Mover a la izquierda">
                <i class="bi bi-arrow-left-circle-fill"></i>
            </button>
            <button id="atirar" type="button" aria-label="Disparar">
                <i class="bi bi-arrow-up-circle-fill"></i>
            </button>
            <button id="direita" type="button" aria-label="Mover a la derecha">
                <i class="bi bi-arrow-right-circle-fill"></i>
            </button>
        </div>
    </main>

    <script src="js/scriptSpace.js"></script>
</body>
</html>
